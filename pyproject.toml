[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "initra"
version = "0.2.0"
description = "A cross-platform CLI for scaffolding production-ready projects"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [{ name = "Justin Kong" }]
license = "MIT"
dependencies = ["rich>=13.7,<14"]
keywords = ["scaffold", "cli", "project-generator", "starter", "templates"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/JustinK33/initra"
Repository = "https://github.com/JustinK33/initra"
Documentation = "https://github.com/JustinK33/initra/blob/main/USAGE.md"
Issues = "https://github.com/JustinK33/initra/issues"
Contributing = "https://github.com/JustinK33/initra/blob/main/CONTRIBUTING.md"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
initra = "initra.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["initra*"]

[tool.setuptools.package-data]
# The second pattern is needed because ** does not match dotfiles such as
# .env.example, .dockerignore, and .clang-format.
initra = ["templates/**/*", "templates/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_pytest.py"]
addopts = "-q"
