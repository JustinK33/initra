[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "initra"
version = "0.1.0"
description = "A cross-platform CLI for scaffolding production-ready projects"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Justin Kong" }]
license = { text = "MIT" }
keywords = ["scaffold", "cli", "project-generator", "starter", "templates"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
initra = "initra:main"

[tool.setuptools]
py-modules = ["initra", "initra_cli", "initra_core", "initra_ops"]
